[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pinned, not left to auto-detect: arc-forge picks the newest solc it can find,
# and Arc's Blockscout only knows compilers up to 0.8.36. An unlisted compiler
# makes source verification fail with a bare "Unable to verify".
solc = "0.8.35"

# Mainnet ships whatever is tested here, and the platform pays gas on every mint
# and every vault deploy, so test the optimized bytecode rather than a build
# nobody will ever deploy.
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
